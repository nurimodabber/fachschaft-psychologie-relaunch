<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sealBg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#26262c"/>
      <stop offset="70%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="sealRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e02844"/>
      <stop offset="100%" stop-color="#a3192d"/>
    </linearGradient>
  </defs>
  <!-- Outer Rot-Schwarz Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#sealBg)" stroke="url(#sealRing)" stroke-width="3"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8"/>
  <!-- University Red Psi Symbol with depth -->
  <text x="32" y="45.5" font-family="Georgia, serif" font-size="39" font-weight="bold" text-anchor="middle" fill="#e02844">ψ</text>
</svg>
